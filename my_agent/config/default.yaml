# Default RAG configuration
llm:
  base_url: "https://api.openai.com/v1"
  api_key: "sk-xxx"
  model: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 2048

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  provider: "sentence-transformers"

chroma:
  persist_directory: "./chroma_db"
  collection_name: "rag_documents"

retriever:
  strategy: "naive"
  top_k: 5

graph:
  enabled: false
  max_nodes: 1000
  max_hops: 2

synthesizer: {}
